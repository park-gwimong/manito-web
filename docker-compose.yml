services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-manito}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # 컨테이너 안에서는 서비스 이름 db로 접속한다. .env의 DATABASE_URL(로컬 개발용)을 덮어쓴다.
      DATABASE_URL: postgres://${POSTGRES_USER:-manito}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manito}
    ports:
      # 같은 호스트의 Caddy만 접근하도록 루프백에만 공개한다.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
